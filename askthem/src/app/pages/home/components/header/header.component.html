<div class="header">
  <div class="logo">
    <img src="assets/images/logo.png" alt="Logo de askthem" class="logo-icon">
    <span class="logo-text">askThem</span>
  </div>
  <div class="header-actions">
    <div class="counter">
      <span class="counter-number">{{user?.monedas}}</span>
      <div class="counter-icon">
        <div [innerHTML]="'assets/images/coins.svg' | svg | async"></div>
      </div>
    </div>
    <div class="settings-icon">
      <div [innerHTML]="'assets/images/settings.svg' | svg | async"></div>
    </div>
  </div>
</div>
